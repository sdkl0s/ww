<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speak up! Дневник английского на 180 дней</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Speak up!">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5B3FD6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#FBF9FF;--paper2:#F0EAFF;--card:#FFFFFF;--ink:#1F1A3D;--ink2:#5A5480;--line:#DCD5F5;--dot:#D3CAF3;
  --edge:#1F1A3D;--drop:#1F1A3D;--on:#1F1A3D;--focus:#5B3FD6;
  --grape:#5B3FD6;--lemon:#FFE45C;--bubble:#FF8DC0;--mint:#8EE6C3;--sky:#8FCBFF;--tang:#FFA245;--lilac:#C7B6FF;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#14102A;--paper2:#1F1A3B;--card:#241E45;--ink:#F4F0FF;--ink2:#B9B0DE;--line:#3A3266;--dot:#2A2350;
    --edge:#B9AEFF;--drop:#07050F;--focus:#C7B6FF;--grape:#7357F0;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#14102A;--paper2:#1F1A3B;--card:#241E45;--ink:#F4F0FF;--ink2:#B9B0DE;--line:#3A3266;--dot:#2A2350;
  --edge:#B9AEFF;--drop:#07050F;--focus:#C7B6FF;--grape:#7357F0;color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px);-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.5;
  color:var(--ink);background-color:var(--paper);
  background-image:radial-gradient(var(--dot) 1.1px,transparent 1.4px);background-size:24px 24px;
}
h1,h2,h3{font-family:'Unbounded','Onest',system-ui,sans-serif;font-weight:700;line-height:1.15;margin:0}
h1{font-size:clamp(26px,6vw,40px);font-weight:800}
h2{font-size:clamp(18px,3.6vw,22px);margin-bottom:12px}
h3{font-size:15px;font-weight:600;margin-bottom:6px}
p{margin:0 0 10px}
ul,ol{margin:0 0 10px;padding-left:22px}
li{margin-bottom:4px}
a{color:var(--focus);font-weight:600}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
.wrap{max-width:920px;margin:0 auto;padding:18px 16px 120px}
.muted{color:var(--ink2)}
.small{font-size:14px}

/* header + tabs */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:2.5px solid var(--edge)}
.top-in{max-width:920px;margin:0 auto;padding:10px 16px 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 16px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:10px;margin-right:auto}
.brand b{font-family:'Unbounded',sans-serif;font-weight:800;font-size:20px;text-decoration:underline wavy var(--bubble) 3px;text-underline-offset:7px}
.brand span{font-size:12px;color:var(--ink2);line-height:1.2}
.chips{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:2.5px solid var(--edge);border-radius:999px;background:var(--card);font-weight:600;font-size:13px;white-space:nowrap}
.chip .lvn{margin-left:2px}
.chip .xp{width:44px;height:8px;border:2px solid var(--edge);border-radius:6px;background:var(--paper2);overflow:hidden;display:inline-block}
.chip .xp i{display:block;height:100%;background:var(--bubble)}
.tabs{display:flex;gap:6px;width:100%;padding:0}
.tab{--tc:var(--lemon);appearance:none;cursor:pointer;display:flex;align-items:center;gap:6px;padding:8px 14px 8px;font-weight:600;font-size:15px;
  border:2.5px solid var(--edge);border-radius:12px 12px 0 0;background:var(--paper2);color:var(--ink2);margin-bottom:-2.5px;position:relative}
.tab span.ic{font-size:17px}
.tab[aria-current="page"]{background:var(--tc);color:var(--on);border-bottom-color:var(--tc)}
@media (max-width:479px){.chip .lvn,.chip .xp{display:none}}
@media (max-width:719px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:2.5px solid var(--edge);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;gap:2px}
  .tab{flex:1;flex-direction:column;gap:0;padding:5px 2px;font-size:11px;border:2.5px solid transparent;border-radius:12px;margin:0;background:transparent}
  .tab span.ic{font-size:20px}
  .tab[aria-current="page"]{border-color:var(--edge)}
  .brand span{display:none}
  .top-in{padding-top:8px}
  .brand,.chips{margin-bottom:8px}
}

/* generic pieces */
.box{background:var(--card);border:2.5px solid var(--edge);border-radius:16px;box-shadow:4px 4px 0 var(--drop);padding:16px;margin-bottom:18px}
.btn{cursor:pointer;font-weight:600;padding:8px 14px;border:2.5px solid var(--edge);border-radius:999px;background:var(--card);color:var(--ink);
  box-shadow:3px 3px 0 var(--drop);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--drop)}
.btn.sm{padding:4px 11px;font-size:13px}
.btn.pri{background:var(--grape);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.on{background:var(--lemon);color:var(--on)}
.pill{display:inline-block;padding:3px 10px;border:2.5px solid var(--edge);border-radius:999px;background:var(--mc,var(--lemon));color:var(--on);font-weight:600;font-size:13px}
.banner{border:2.5px dashed var(--edge);border-radius:14px;padding:12px 14px;margin-bottom:16px;background:var(--paper2)}
label{display:block;font-weight:600;font-size:14px;margin-bottom:12px}
input,textarea{font:inherit;color:var(--ink);background:var(--paper);border:2.5px solid var(--edge);border-radius:12px;padding:9px 12px;width:100%;margin-top:4px;font-weight:400}
textarea{resize:vertical;min-height:76px}
input::placeholder,textarea::placeholder{color:var(--ink2);opacity:.75}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.two{grid-template-columns:1fr;gap:0}}

/* today hero */
.hero{display:flex;gap:18px;align-items:center;margin:6px 0 18px;--mc:var(--lemon)}
.stamp{flex:none;width:118px;height:118px;border-radius:50%;background:var(--mc);border:2.5px solid var(--edge);box-shadow:4px 4px 0 var(--drop);
  display:grid;place-items:center;align-content:center;transform:rotate(-6deg);position:relative;color:var(--on);text-align:center;line-height:1}
.stamp::after{content:"";position:absolute;inset:7px;border:2px dashed var(--on);border-radius:50%;opacity:.5}
.stamp small{font-size:12px;font-weight:600}
.stamp b{font-family:'Unbounded',sans-serif;font-weight:800;font-size:40px;margin:3px 0}
.hero-t .date{font-weight:600;color:var(--ink2);margin-bottom:4px}
.hero-t .sub{margin:6px 0 8px;color:var(--ink2)}
.hero-t h1{font-size:clamp(20px,5vw,32px)}
@media (max-width:479px){.stamp{width:92px;height:92px}.stamp b{font-size:30px}.hero{gap:14px}}
.daynav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.meter-wrap{margin-bottom:18px}
.meter{height:18px;border:2.5px solid var(--edge);border-radius:12px;background:var(--paper2);overflow:hidden}
.meter i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--bubble) 0 10px,#FFB3D6 10px 20px);transition:width .35s ease}
.meter-t{margin:6px 0 0;font-size:14px;color:var(--ink2);font-weight:500}

.note{background:var(--lemon);color:var(--on);border:2.5px solid var(--edge);box-shadow:4px 4px 0 var(--drop);border-radius:6px 6px 6px 26px;
  padding:22px 18px 16px;margin:14px 4px 22px;transform:rotate(-.8deg);position:relative}
.note::before{content:"";position:absolute;top:-13px;left:50%;width:92px;height:24px;transform:translateX(-50%) rotate(3deg);border:2px solid var(--edge);
  background:repeating-linear-gradient(45deg,var(--bubble) 0 9px,#FFD3E8 9px 18px)}
.note h2{font-size:16px;margin-bottom:10px}
.ph{padding:10px 0;border-top:2px dashed rgba(31,26,61,.35)}
.ph:first-of-type{border-top:none;padding-top:0}
.ph-h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:2px}
.ph-h b{font-family:'Unbounded',sans-serif;font-size:17px;font-weight:700}
.tone{font-size:12px;font-weight:600;border:2px solid var(--on);border-radius:999px;padding:0 8px}
.ex{border-left:4px solid var(--on);padding-left:10px;margin:6px 0 8px;font-weight:500}
.note .btn{color:var(--on);background:#fff}

.tasks{display:grid;gap:14px;margin-bottom:22px}
.task{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:14px 14px 14px 22px;border:2.5px solid var(--edge);border-radius:16px;background:var(--card);
  box-shadow:4px 4px 0 var(--drop);cursor:pointer;position:relative;overflow:hidden;--bc:var(--lemon)}
.task::before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;background:var(--bc);border-right:2.5px solid var(--edge)}
.chk{width:36px;height:36px;border:2.5px solid var(--edge);border-radius:11px;background:var(--paper);display:grid;place-items:center;font-size:22px;font-weight:800;color:transparent;cursor:pointer;padding:0;line-height:1}
.task.done .chk{background:var(--bc);color:var(--on)}
.task.done{background:var(--paper2)}
.task.done .tname{text-decoration:line-through;text-decoration-thickness:2px}
.thead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
.tname{font-family:'Unbounded',sans-serif;font-weight:600;font-size:14.5px}
.tmin{font-weight:700;font-size:13px;white-space:nowrap;background:var(--bc);color:var(--on);border:2px solid var(--edge);border-radius:999px;padding:0 9px}
.focus{margin:6px 0 4px;font-weight:600}
.how{margin:0;font-size:14px;color:var(--ink2)}
.task .btn{margin-top:8px}

.fix .bad{font-family:'Unbounded',sans-serif;font-size:17px;font-weight:600;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;cursor:pointer;padding:10px 14px;margin-bottom:8px;border:2.5px solid var(--edge);border-radius:12px;background:var(--paper);font-weight:500}
.opt:hover:not(:disabled){background:var(--paper2)}
.opt.ok{background:var(--mint);color:var(--on)}
.opt.no{background:var(--bubble);color:var(--on);text-decoration:line-through}
.opt:disabled{cursor:default}
.why{margin:6px 0 0;font-size:14.5px}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
.mood{cursor:pointer;display:grid;gap:0;place-items:center;padding:6px 2px;border:2.5px solid var(--edge);border-radius:14px;background:var(--paper)}
.mood span{font-size:26px;line-height:1.2}
.mood small{font-size:11px;color:var(--ink2);font-weight:600}
.mood.on{background:var(--lemon);box-shadow:3px 3px 0 var(--drop)}
.mood.on small{color:var(--on)}

/* details, roadmap */
details.g{border:2.5px solid var(--edge);border-radius:16px;background:var(--card);box-shadow:4px 4px 0 var(--drop);margin-bottom:16px}
details.g>summary{list-style:none;cursor:pointer;padding:14px 16px;font-family:'Unbounded',sans-serif;font-weight:600;font-size:15px;display:flex;align-items:center;gap:10px;justify-content:space-between}
details.g>summary::-webkit-details-marker{display:none}
details.g>summary::after{content:"+";font-family:'Onest',sans-serif;font-size:24px;font-weight:700;line-height:1}
details.g[open]>summary::after{content:"–"}
details.g[open]>summary{border-bottom:2.5px solid var(--edge)}
.g-body{padding:14px 16px 6px}
.road{position:relative;padding-left:50px;margin-top:6px}
.road::before{content:"";position:absolute;left:19px;top:16px;bottom:24px;border-left:3px dashed var(--edge)}
.stn{position:relative;margin-bottom:18px}
.stn .num{position:absolute;left:-50px;top:8px;width:40px;height:40px;border-radius:50%;background:var(--c);border:2.5px solid var(--edge);display:grid;place-items:center;
  font-family:'Unbounded',sans-serif;font-weight:800;font-size:16px;color:var(--on);box-shadow:3px 3px 0 var(--drop)}
.stn details.g{margin-bottom:0}
.stn summary .st{display:block}
.stn summary small{display:block;font-family:'Onest',sans-serif;font-weight:500;font-size:13px;color:var(--ink2);margin-top:2px}
.here{background:var(--bubble);color:var(--on);border:2px solid var(--edge);border-radius:999px;font-size:11px;padding:0 8px;margin-left:6px;font-family:'Onest',sans-serif;font-weight:700;vertical-align:middle}
.mix{display:flex;border:2.5px solid var(--edge);border-radius:12px;overflow:hidden;margin:6px 0 12px}
.mix span{padding:3px 0;text-align:center;font-size:12px;font-weight:700;color:var(--on);border-right:2px solid var(--edge)}
.mix span:last-child{border-right:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-bottom:14px}
.legend i{display:inline-block;width:12px;height:12px;border:2px solid var(--edge);border-radius:4px;margin-right:5px;vertical-align:-1px}
.brow{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:8px 0;border-top:2px dotted var(--line)}
.brow:first-child{border-top:none}
.brow .m{font-weight:700;font-size:13px;background:var(--bc);color:var(--on);border:2px solid var(--edge);border-radius:999px;padding:0 9px;height:fit-content;white-space:nowrap}
.sprint{display:grid;grid-template-columns:78px 1fr;gap:4px 12px;padding:8px 0;border-top:2px dotted var(--line);font-size:14.5px}
.sprint:first-of-type{border-top:none}
.sprint b{font-weight:700}
.res{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.res a,.res span{display:inline-block;padding:3px 10px;border:2px solid var(--edge);border-radius:999px;font-size:13.5px;font-weight:600;text-decoration:none;background:var(--paper2);color:var(--ink)}
.res a:hover{background:var(--lemon);color:var(--on)}
.fixes{display:grid;gap:8px;margin:8px 0 6px}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;font-weight:600}
.pair s{color:var(--ink2);text-decoration-color:var(--bubble);text-decoration-thickness:3px}
.pair em{font-style:normal;background:var(--mint);color:var(--on);padding:2px 8px;border-radius:8px;border:2px solid var(--edge)}
@media (max-width:560px){.pair{grid-template-columns:1fr;gap:2px}.pair .ar{display:none}}

/* journal */
.receipt{background:#fff;color:#1F1A3D;border:2.5px solid var(--edge);box-shadow:4px 4px 0 var(--drop);padding:18px 20px;max-width:440px;margin:0 auto 24px;transform:rotate(.6deg);border-radius:6px}
.receipt h2{text-align:center;font-size:17px;margin-bottom:2px;color:#1F1A3D}
.receipt .c{text-align:center;font-size:13px;color:#5A5480;margin-bottom:12px}
.rrow{display:flex;gap:6px;align-items:baseline;padding:2px 0;font-size:15px}
.rrow i{flex:1;border-bottom:2px dotted #1F1A3D;opacity:.35;transform:translateY(-4px)}
.rrow b{font-weight:700}
.rtot{border-top:3px dashed #1F1A3D;margin-top:8px;padding-top:8px;font-size:17px}
.hm-h{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 6px;font-weight:600}
.hm{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
@media (min-width:720px){.hm{grid-template-columns:repeat(15,1fr)}}
.cell{aspect-ratio:1;border:2px solid var(--edge);border-radius:9px;background:var(--paper2);font-size:11px;font-weight:700;color:var(--ink2);cursor:pointer;padding:0;position:relative}
.cell.p{background:var(--lemon);color:var(--on)}
.cell.f{background:var(--mint);color:var(--on)}
.cell.b{background:var(--sky);color:var(--on)}
.cell.fut{opacity:.5;border-style:dashed}
.cell.today{outline:3px solid var(--focus);outline-offset:1px}
.cell.cp::after{content:"★";position:absolute;top:-8px;right:-4px;font-size:13px;color:var(--tang);text-shadow:-1px 0 var(--edge),1px 0 var(--edge),0 1px var(--edge),0 -1px var(--edge)}
.hm-leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;margin:12px 0 4px}
.hm-leg i{display:inline-block;width:14px;height:14px;border:2px solid var(--edge);border-radius:5px;margin-right:5px;vertical-align:-2px}
.stk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:14px;padding:6px 4px}
.stk{border:2.5px solid var(--edge);border-radius:18px;background:var(--c);color:var(--on);padding:12px 6px 10px;text-align:center;box-shadow:3px 3px 0 var(--drop);transform:rotate(var(--r,0deg))}
.stk .e{font-size:34px;line-height:1.2}
.stk .n{font-size:12.5px;font-weight:700;line-height:1.2;margin-top:4px}
.stk .d{font-size:11px;font-weight:500;opacity:.8;margin-top:2px}
.stk.lock{background:var(--paper2);color:var(--ink2);box-shadow:none;border-style:dashed}
.stk.lock .e{filter:grayscale(1);opacity:.45}
.ms{display:grid;gap:8px;margin-bottom:6px}
.msr{display:flex;gap:12px;align-items:center;cursor:pointer;padding:8px 10px;border:2.5px solid var(--edge);border-radius:12px;background:var(--paper);font-weight:500}
.msr .chk{width:28px;height:28px;font-size:17px;border-radius:9px;flex:none}
.msr.done{background:var(--paper2)}
.msr.done .chk{background:var(--mint);color:var(--on)}
.book{display:grid;gap:8px}
.bk{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:8px 10px;border-radius:12px;border:2px solid var(--line);background:var(--paper)}
.bk .dn{font-weight:700;font-size:12px;background:var(--lilac);color:var(--on);border:2px solid var(--edge);border-radius:999px;padding:0 8px;height:fit-content}
.bk s{text-decoration-color:var(--bubble);text-decoration-thickness:3px;color:var(--ink2)}
.bk em{font-style:normal;font-weight:600}
.empty{padding:14px;border:2.5px dashed var(--line);border-radius:14px;color:var(--ink2);text-align:center}

/* slang */
.chipbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.sl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.sl{cursor:pointer;border:2.5px solid var(--edge);border-radius:16px;background:var(--card);box-shadow:4px 4px 0 var(--drop);padding:0 0 12px;overflow:hidden;min-height:150px;display:flex;flex-direction:column}
.sl-bar{height:14px;background:var(--c);border-bottom:2.5px solid var(--edge)}
.sl-in{padding:12px 14px 0;flex:1}
.sl .en{font-family:'Unbounded',sans-serif;font-weight:700;font-size:17px;margin-bottom:4px;overflow-wrap:anywhere}
.sl .tp{display:inline-block;font-size:12px;font-weight:600;border:2px solid var(--edge);border-radius:999px;padding:0 8px;background:var(--c);color:var(--on)}
.sl .hint{font-size:13px;color:var(--ink2);margin-top:10px}
.sl .ru{font-weight:700;margin:8px 0 4px}
.sl .ex{margin:4px 0 8px;font-size:14.5px}
.sl .foot{padding:0 14px}
.sl.known{background:var(--paper2)}
.qbox{max-width:620px;margin:0 auto}
.qp{font-family:'Unbounded',sans-serif;font-weight:600;font-size:17px;margin-bottom:12px;line-height:1.3}
.qx{background:var(--lemon);color:var(--on);border:2.5px solid var(--edge);border-radius:12px;padding:12px 14px;font-weight:600;margin-bottom:14px}
.qs{font-size:40px;text-align:center;margin:6px 0}

/* checks */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:8px 10px;text-align:left;border-bottom:2px dotted var(--line);vertical-align:top}
.tbl th{font-weight:700;border-bottom:2.5px solid var(--edge)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cpst{font-family:'Onest',sans-serif;font-weight:600;font-size:12px;border:2px solid var(--edge);border-radius:999px;padding:0 8px;background:var(--paper2);color:var(--ink);white-space:nowrap}
.cpst.ok{background:var(--mint);color:var(--on)}
.cpst.now{background:var(--tang);color:var(--on)}
.tip{border:2.5px solid var(--edge);background:var(--sky);color:var(--on);border-radius:14px;padding:12px 14px;margin-bottom:16px;font-weight:500}

const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ds(d);};
const fmtDate=(s,o)=>cap(parse(s).toLocaleDateString('ru-RU',o));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;};

function loadLocal(){try{const r=localStorage.getItem(LS_KEY);if(r){const o=JSON.parse(r);if(o&&typeof o==='object')return Object.assign(blank(),o);}}catch(e){}return null;}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}}

let dbDoc=null,syncState='local',pushing=false,pushAgain=false,pushTimer=null;
function save(){S.updated=Date.now();_st=null;saveLocal();schedulePush();}
function schedulePush(){if(!dbDoc)return;clearTimeout(pushTimer);pushTimer=setTimeout(pushRemote,1200);}
async function pushRemote(){
  if(!dbDoc)return;
  if(pushing){pushAgain=true;return;}
  pushing=true;
  try{await dbDoc.set({json:JSON.stringify(S),updated:S.updated});syncState='cloud';}catch(e){syncState='error';}
  pushing=false;
  if(pushAgain){pushAgain=false;schedulePush();}
  renderFoot();
}
async function initSync(){
  try{
    if(!window.claude||typeof window.claude.use!=='function')return;
    const db=await window.claude.use('db');
    const user=await window.claude.use('user');
    if(!db||!user)return;
    const id=await user.id();
    if(!id)return;
    dbDoc=db.doc('data/users/'+id+'/planner');
    const snap=await dbDoc.get();
    if(snap.exists){
      const d=snap.data()||{};
      if(typeof d.json==='string'&&(d.updated||0)>(S.updated||0)){
        const o=JSON.parse(d.json);
        S=Object.assign(blank(),o);_st=null;saveLocal();
        ui.day=clampDay(dayIdx(todayStr()));
        render();
      }else if((S.updated||0)>(d.updated||0)){pushRemote();}
    }else{
      S.updated=S.updated||Date.now();saveLocal();pushRemote();
    }
    syncState='cloud';renderFoot();
  }catch(e){syncState='local';}
}

/* ================= PLAN LOGIC ================= */
const dayIdx=s=>diffDays(s,S.start)+1;
const dateOf=i=>addDays(S.start,i-1);
const clampDay=i=>Math.max(1,Math.min(PLAN_DAYS,i));
const monthOf=i=>Math.max(1,Math.min(6,Math.ceil(i/30)));
const sprintOf=i=>{const d=((i-1)%30);return d<7?0:d<15?1:d<22?2:3;};
const isLight=i=>(i>=50&&i<=56)||(i>=106&&i<=112)||(i>=162&&i<=168);
const rotIndex=m=>m===1?0:m===2?1:m<=4?2:m===5?3:4;
const slangCards=i=>SLANG_ORDER.slice((i-1)*2,(i-1)*2+2);

function gramFocus(i,M,sp){
  if(M.n===1){
    if(i<=16)return `«Полиглот» Петрова: урок №${i} из 16. Посмотри, потом проговори ключевые фразы вслух.`;
    return i<=23?'Murphy: to be, have got, Present Simple.':'Murphy: Present Continuous, there is/are, can, some/any.';
  }
  return sp.g;
}
function planFor(idx,rec){
  const m=monthOf(idx),M=MONTHS[m-1],sp=M.sprints[sprintOf(idx)];
  const B=(id,min,focus,how)=>({id:id,e:BN[id][0],name:BN[id][1],c:BC[id],min:min,focus:focus,how:how||''});
  if(CP_DAYS.indexOf(idx)>=0)return {kind:'cp',blocks:[
    {id:'cp',e:'🎯',name:'Чекпоинт: проверка прогресса',c:'tang',min:40,focus:'Запиши 2 минуты речи, проверь понимание на слух, посмотри удержание в Anki и напиши текст на 8–10 предложений.',how:'Цифры из формы покажут, что улучшилось.<br><button class="btn sm" data-act="tab" data-tab="checks">Открыть форму чекпоинта</button>'},
    {id:'fun',e:'🍿',name:'Награда: любимый контент',c:'mint',min:20,focus:'Серия, музыка или чат на английском. Просто для удовольствия.',how:''}]};
  if(rec&&rec.bad)return {kind:'bad',blocks:[
    {id:'b1',e:'🧠',name:'Anki, 10 минут',c:'mint',min:10,focus:'Только повторения, новых карточек сегодня нет.',how:''},
    {id:'b2',e:'🎧',name:'Просмотр, 10 минут',c:'sky',min:10,focus:'Одна короткая сцена с английскими субтитрами.',how:''},
    {id:'b3',e:'🎙️',name:'Речь, 10 минут',c:'bubble',min:10,focus:`«Комментатор» вслух: I'm making tea. I'm going to the shop.`,how:''}]};
  const speak=ROT[rotIndex(m)][idx%7];
  const topic='Тема недели: '+sp.s;
  if(isLight(idx))return {kind:'light',blocks:[
    B('w',15,M.txt.w,'Лёгкая неделя: грамматику пропускаем, занимаемся приятным и разговорным.'),
    B('l',30,sp.l,M.txt.l),B('s',30,speak,topic)]};
  if(idx%7===0)return {kind:'easy',blocks:[
    {id:'fun',e:'🍿',name:'Лёгкий день',c:'mint',min:40,focus:'30–40 минут только того, что нравится: серия, музыка, чат. Без упражнений и подсчёта ошибок.',how:''}]};
  const x=slangCards(idx);
  const sf=x.length?`Сегодня: <b>${x.map(c=>esc(c.en)).join('</b> и <b>')}</b>. Используй хотя бы одну в течение 48 часов: вслух, в голосовом или в тексте.`
    :'Возьми 2 фразы из реального контента (знакомый, сериал, влог). Проверь в Cambridge Dictionary и придумай своё предложение.';
  return {kind:'reg',blocks:[
    B('g',M.min.g,gramFocus(idx,M,sp),M.txt.g),
    B('w',M.min.w,M.txt.w,'Не больше 10 новых карточек: иначе долг по повторам быстро растёт.'),
    B('l',M.min.l,sp.l,M.txt.l),
    B('s',M.min.s,speak,topic),
    B('x',M.min.x,sf,'Свою ошибку и правильный вариант записывай ниже, в «Записках на полях».')]};
}
function dayStat(i){
  const rec=S.days[dateOf(i)];const p=planFor(i,rec);let tot=0,dn=0;
  p.blocks.forEach(b=>{tot+=b.min;if(rec&&rec.done&&rec.done[b.id])dn+=b.min;});
  return {rec:rec,p:p,tot:tot,dn:dn};
}
const dayPct=i=>{const s=dayStat(i);return s.tot?Math.round(s.dn/s.tot*100):0;};

function computeStats(){
  const tIdx=dayIdx(todayStr());
  let minutes=0,full=0,best=0,run=0,badDone=0,easyDone=0,fixOK=0;
  const mc=[0,0,0,0,0,0],counted={};
  for(let i=1;i<=PLAN_DAYS;i++){
    const s=dayStat(i);
    if(!s.rec){run=0;continue;}
    minutes+=s.dn;
    const done=s.tot>0&&s.dn===s.tot;
    if(done){full++;if(s.p.kind==='bad')badDone++;if(s.p.kind==='easy')easyDone++;}
    if(s.dn>=30||done){counted[i]=1;mc[monthOf(i)-1]++;run++;if(run>best)best=run;}else run=0;
    if(s.rec.fx!==undefined&&s.rec.fx===FIX[(i-1)%FIX.length].a)fixOK++;
  }
  let cur=0,i=Math.min(tIdx,PLAN_DAYS);
  if(i>=1){if(!counted[i])i--;while(i>=1&&counted[i]){cur++;i--;}}
  const known=SLANG.filter(c=>S.slang[c.id]).length;
  const cps=CP_DAYS.filter(d=>{const c=S.cps['c'+d];return c&&(c.listen||c.anki||c.speechMin||c.speechErr||c.live);}).length;
  const msn=MILESTONES.filter(m=>S.ms[m.id]).length;
  const xp=minutes+10*known+5*fixOK+30*cps+20*msn+(S.quiz||0);
  return {minutes:minutes,full:full,best:best,cur:cur,badDone:badDone,easyDone:easyDone,fixOK:fixOK,monthCounts:mc,known:known,cps:cps,msn:msn,xp:xp};
}
const stats=()=>_st||(_st=computeStats());
function levelInfo(){
  const xp=stats().xp;let i=0;
  LEVELS.forEach((l,k)=>{if(xp>=l.x)i=k;});
  const cur=LEVELS[i],nxt=LEVELS[i+1];
  return {i:i,xp:xp,n:cur.n,e:cur.e,p:nxt?Math.round((xp-cur.x)/(nxt.x-cur.x)*100):100};
}

function nextToast(){
  const m=TQ.shift();const el=$('#toast');
  if(!m){tBusy=false;return;}
  tBusy=true;el.textContent=m;el.classList.add('on');
  setTimeout(()=>{el.classList.remove('on');setTimeout(nextToast,220);},2300);
}
function confetti(){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cols=['--lemon','--bubble','--mint','--sky','--tang','--lilac'];
  for(let i=0;i<46;i++){
    const p=document.createElement('i');p.className='cf';
    p.style.left=(Math.random()*100)+'vw';
    p.style.background='var('+cols[i%6]+')';
    p.style.setProperty('--dx',(Math.random()*200-100)+'px');
    p.style.animationDelay=(Math.random()*.25)+'s';
    p.style.animationDuration=(1.2+Math.random()*.9)+'s';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),2600);
  }
}
function copyText(text){
  const fb=()=>{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}t.remove();return ok;};
  try{if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(text).then(()=>true).catch(()=>fb());}}catch(e){}
  return Promise.resolve(fb());
}

function det(k,title,body,def,extra){
  return `<details class="g" data-k="${k}" ${isOpen(k,def)?'open':''}${extra||''}><summary><span>${title}</span></summary><div class="g-body">${body}</div></details>`;
}
function setupList(){
  return `<div class="ms">${SETUP.map(s=>`<div class="msr ${S.setup[s.id]?'done':''}" data-act="setup" data-id="${s.id}"><button class="chk" role="checkbox" aria-checked="${!!S.setup[s.id]}" aria-label="${esc(s.t)}">✓</button><span>${esc(s.t)} <a href="${s.u}" target="_blank" rel="noopener noreferrer">сайт</a></span></div>`).join('')}</div>`;
}
function resChips(list){
  return `<div class="res">${list.map(r=>{
    if(r.k==='yt')return `<a href="https://www.youtube.com/results?search_query=${encodeURIComponent(r.q||r.n)}" target="_blank" rel="noopener noreferrer">▶ ${esc(r.n)}</a>`;
    if(r.k==='app')return `<a href="${r.u}" target="_blank" rel="noopener noreferrer">📲 ${esc(r.n)}</a>`;

  if(idx<=7)o+=det('setup-today','🎒 Стартовый набор недели',`<p class="muted small">Установи всё это в первую неделю. Отмечай, что уже сделано.</p>${setupList()}`,idx===1);
  if(plan.kind!=='cp'){

  o+=`<section class="box"><h2>Записки на полях</h2>
   <div class="moods" role="group" aria-label="Как прошёл день">${[['😫','Тяжело'],['😕','Так себе'],['🙂','Норм'],['😄','Хорошо'],['🤩','Супер']].map((m,i)=>`<button class="mood ${rec.mood===i+1?'on':''}" data-act="mood" data-v="${i+1}" aria-pressed="${rec.mood===i+1}"><span>${m[0]}</span><small>${m[1]}</small></button>`).join('')}</div>
   <label>Моя фраза дня по-английски<input data-f="phrase" value="${esc(rec.phrase||'')}" placeholder="I'm going to the shop to buy a book." autocomplete="off"></label>
   <div class="two"><label>Моя ошибка<input data-f="err" value="${esc(rec.err||'')}" placeholder="I today very tired" autocomplete="off"></label>
   <label>Как правильно<input data-f="ok" value="${esc(rec.ok||'')}" placeholder="I'm very tired today." autocomplete="off"></label></div>
   <label>Заметки дня<textarea data-f="note" rows="3" placeholder="Что получилось, что было трудно, что хочется сказать себе.">${esc(rec.note||'')}</textarea></label></section>`;
  return o;
}

function mkQ(c){
  const others=shuffle(SLANG.filter(x=>x.id!==c.id)).slice(0,3);
  const opts=shuffle([c].concat(others));
  return {c:c,type:Math.random()<.5?'A':'B',opts:opts,ans:opts.indexOf(c)};
}
function viewQuiz(){
  const Q=ui.quiz;
  if(Q.done){
    return `<div class="qbox box"><h2 style="text-align:center">Готово!</h2><div class="qs">${Q.score===5?'🏆':Q.score>=3?'🎉':'💪'}</div><p style="text-align:center"><b>${Q.score} из 5.</b> ${Q.score===5?'Идеально, no cap!':Q.score>=3?'Nice! Ещё раз, и будет 5 из 5.':'Ничего страшного: повтори карточки и попробуй снова.'}</p><div class="daynav" style="justify-content:center"><button class="btn pri" data-act="quiz-start">Ещё раз</button><button class="btn" data-act="quiz-exit">К карточкам</button></div></div>`;
  }
  const q=Q.q[Q.i];
  const prompt=q.type==='A'?`Что значит фраза в этом предложении?`:`Как сказать по-английски: «${esc(q.c.ru)}»?`;
  return `<div class="qbox"><p class="muted small">Вопрос ${Q.i+1} из 5 · верных: ${Q.score}</p><h2 class="qp" style="font-size:17px">${prompt}</h2>${q.type==='A'?`<div class="qx">${esc(q.c.ex)}</div>`:''}
   ${q.opts.map((c,i)=>{let cls='';if(Q.picked!==null){if(i===q.ans)cls='ok';else if(i===Q.picked)cls='no';}
     return `<button class="opt ${cls}" data-act="quiz-pick" data-i="${i}" ${Q.picked!==null?'disabled':''}>${esc(q.type==='A'?c.ru:c.en)}</button>`;}).join('')}
   ${Q.picked!==null?`<p class="why"><b>${Q.picked===q.ans?'Верно! ':'Не совсем. '}</b>${esc(q.c.en)} значит «${esc(q.c.ru)}».</p><p><button class="btn pri" data-act="quiz-next">${Q.i<4?'Дальше':'Результат'}</button></p>`:''}
   <p><button class="btn sm" data-act="quiz-exit">Выйти из квиза</button></p></div>`;
}

function chartSvg(){
  const W=560,H=200,pl=34,pr=12,pt=10,pb=26;
  const X=k=>pl+(W-pl-pr)*k/(CP_DAYS.length-1),Y=v=>pt+(H-pt-pb)*(1-v/100);
  const ser=[{k:'listen',n:'Слушание, %',c:'--grape'},{k:'anki',n:'Anki, %',c:'--tang'}];
  let g='';
  [0,25,50,75,100].forEach(v=>{g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line);stroke-width:1.5"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;});
  CP_DAYS.forEach((d,k)=>{g+=`<text x="${X(k)}" y="${H-8}" text-anchor="middle">${d}</text>`;});
  let any=0;
  ser.forEach(s=>{
    const pts=[];CP_DAYS.forEach((d,k)=>{const c=S.cps['c'+d];if(c&&c[s.k]!==undefined&&c[s.k]!==''&&!isNaN(+c[s.k]))pts.push([X(k),Y(Math.max(0,Math.min(100,+c[s.k])))]);});
    if(!pts.length)return;any+=pts.length;
    g+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" style="stroke:var(${s.c});stroke-width:3"/>`;
    pts.forEach(p=>{g+=`<circle cx="${p[0]}" cy="${p[1]}" r="5" style="fill:var(${s.c});stroke:var(--edge);stroke-width:2"/>`;});
  });
  if(!any)return '';
  return `<div class="box"><h2>Динамика</h2><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="График слушания и удержания Anki по чекпоинтам">${g}</svg>
   <div class="legend">${ser.map(s=>`<span><i style="background:var(${s.c})"></i>${s.n}</span>`).join('')}<span class="muted">По горизонтали: день плана</span></div></div>`;
}
function stagnation(){
  const a=CP_DAYS.map(d=>S.cps['c'+d]).filter(c=>c&&c.listen!==undefined&&c.listen!==''&&!isNaN(+c.listen)).map(c=>+c.listen);
  const n=a.length;return n>=3&&a[n-1]<=a[n-3]&&a[n-2]<=a[n-3];
}

function renderTop(){
  const L=levelInfo(),st=stats();
  $('#chips').innerHTML=`<span class="chip" title="Уровень">${L.e} <span>Lv ${L.i+1}</span><span class="lvn">${esc(L.n)}</span><span class="xp" aria-hidden="true"><i style="width:${L.p}%"></i></span></span><span class="chip" title="Цепочка дней">🔥 ${st.cur}</span>`;
  document.querySelectorAll('#tabs .tab').forEach(b=>{if(b.dataset.tab===ui.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
}
function renderFoot(){
  const m={cloud:'Прогресс сохраняется и синхронизируется между твоими устройствами ☁️',local:'Прогресс хранится на этом устройстве. Если очистишь данные браузера, он пропадёт.',error:'Не получилось синхронизировать, прогресс пока хранится на этом устройстве.'}[syncState];
  const el=$('#foot');if(el)el.innerHTML=`<p>${m}</p>`;
}
function render(){
  const y=window.scrollY;
  renderTop();
  const V={today:viewToday,plan:viewPlan,journal:viewJournal,slang:viewSlang,checks:viewChecks,guide:viewGuide};
  $('#view').innerHTML=V[ui.tab]();
  renderFoot();
  window.scrollTo(0,y);
}
function goTab(t){ui.tab=t;render();window.scrollTo(0,0);}

/* ================= EVENTS ================= */
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.tagName==='DETAILS'&&d.dataset&&d.dataset.k)ui.open[d.dataset.k]=d.open;},true);

document.addEventListener('click',e=>{
  if(e.target.closest('a'))return;
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act,D=a.dataset;
  switch(act){
    case 'tab':goTab(D.tab);break;
    case 'prev':ui.day=clampDay(ui.day-1);render();break;
    case 'next':ui.day=clampDay(ui.day+1);render();break;
    case 'today':ui.day=clampDay(dayIdx(todayStr()));render();break;
    case 'go':ui.day=clampDay(+D.d);goTab('today');break;
    case 'gomonth':ui.day=(+D.m-1)*30+1;goTab('today');break;
    case 'tick':{
      if(ui.day>dayIdx(todayStr())){toast('Этот день ещё впереди. Отметишь, когда он наступит 🙂');return;}
      const before=dayPct(ui.day),id=D.id;
      mutate(()=>{const r=dayRec();r.done=r.done||{};if(r.done[id])delete r.done[id];else r.done[id]=true;});
      if(dayPct(ui.day)===100&&before<100){confetti();toast(CHEERS[Math.floor(Math.random()*CHEERS.length)]);}
      break;}
    case 'bad':mutate(()=>{const r=dayRec();r.bad=!r.bad;if(!r.bad)delete r.bad;});break;
    case 'mood':mutate(()=>{const r=dayRec();r.mood=(r.mood===+D.v)?undefined:+D.v;});break;
    case 'fx':{
      if(ui.day>dayIdx(todayStr()))return;
      const f=FIX[(ui.day-1)%FIX.length],i=+D.i;
      mutate(()=>{dayRec().fx=i;});
      if(i===f.a)toast('Верно! +5 XP');
      break;}
    case 'known':mutate(()=>{if(S.slang[D.id])delete S.slang[D.id];else S.slang[D.id]=true;});break;
    case 'flip':ui.flip[D.id]=!ui.flip[D.id];render();break;
    case 'cat':ui.cat=D.c;render();break;
    case 'ms':mutate(()=>{if(S.ms[D.id])delete S.ms[D.id];else S.ms[D.id]=true;});break;
    case 'setup':mutate(()=>{if(S.setup[D.id])delete S.setup[D.id];else S.setup[D.id]=true;});break;
    case 'quiz-start':ui.quiz={i:0,score:0,picked:null,done:false,q:shuffle(SLANG.slice()).slice(0,5).map(mkQ)};if(ui.tab!=='slang')ui.tab='slang';render();window.scrollTo(0,0);break;
    case 'quiz-exit':ui.quiz=null;render();break;
    case 'quiz-pick':{
      const Q=ui.quiz;if(!Q||Q.picked!==null)return;
      const i=+D.i,ok=i===Q.q[Q.i].ans;Q.picked=i;if(ok)Q.score++;
      mutate(()=>{if(ok)S.quiz=(S.quiz||0)+4;});
      break;}
    case 'quiz-next':{
      const Q=ui.quiz;if(!Q)return;
      if(Q.i<4){Q.i++;Q.picked=null;render();}
      else{Q.done=true;if(Q.score===5){mutate(()=>{S.quizPerfect=true;});confetti();}else render();window.scrollTo(0,0);}
      break;}
    case 'copy':
      copyText(FRIEND_MSG).then(ok=>toast(ok?'Скопировано. Отправляй смело 💌':'Не получилось скопировать. Выдели текст и скопируй вручную.'));
      break;
    case 'reset1':ui.reset=true;render();break;
    case 'reset0':ui.reset=false;render();break;
    case 'reset2':
      ui.reset=false;
      mutate(()=>{const keep=S.updated;S=blank();S.updated=keep;});
      ui.day=clampDay(dayIdx(todayStr()));render();toast('Всё сброшено. Начинаем с чистого листа ✨');
      break;
  }
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.sl,.task,.msr')&&e.target===document.activeElement){e.preventDefault();e.target.click();}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.f){const k=t.dataset.f;soft(()=>{dayRec()[k]=t.value;});}
  else if(t.dataset&&t.dataset.cp){const id=t.dataset.cp,k=t.dataset.k;soft(()=>{const c=S.cps[id]||(S.cps[id]={});c[k]=t.value;});}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='startDate'&&t.value){mutate(()=>{S.start=t.value;});ui.day=clampDay(dayIdx(todayStr()));render();toast('Дата старта обновлена');}
  else if(t.dataset&&t.dataset.cp){renderTop();}
});
let lastToday=todayStr();
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){const t=todayStr();if(t!==lastToday){lastToday=t;_st=null;ui.day=clampDay(dayIdx(t));render();}}
});

/* ================= START ================= */
checkBadges();
render();
initSync();

</script>
</body>
</html>
